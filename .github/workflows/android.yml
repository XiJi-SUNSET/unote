name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK 36
        run: |
          # runner 自带 Android SDK；setup-android@v3 会去装已被移除的 'tools' 包，
          # 所以直接调用 sdkmanager。
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Assert no INTERNET permission
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "::error::INTERNET permission is back in the manifest"
            exit 1
          fi
          echo "manifest has no network permission"

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "code=$(echo "${GITHUB_REF_NAME#v}" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.4" >> "$GITHUB_OUTPUT"
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble debug APK
        working-directory: android
        env:
          UNOTE_KEYSTORE_BASE64: ${{ secrets.UNOTE_KEYSTORE_BASE64 }}
          UNOTE_STORE_PASSWORD: ${{ secrets.UNOTE_STORE_PASSWORD }}
          UNOTE_KEY_ALIAS: ${{ secrets.UNOTE_KEY_ALIAS }}
          UNOTE_KEY_PASSWORD: ${{ secrets.UNOTE_KEY_PASSWORD }}
          UNOTE_VERSION_CODE: ${{ steps.version.outputs.code }}
          UNOTE_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          if [ -n "$UNOTE_KEYSTORE_BASE64" ]; then
            echo "$UNOTE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/unote.p12"
            export UNOTE_KEYSTORE_PATH="$RUNNER_TEMP/unote.p12"
            echo "signing with the stable key"
          else
            echo "::warning::no signing key in secrets, falling back to the runner debug key"
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/unote-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: unote-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
