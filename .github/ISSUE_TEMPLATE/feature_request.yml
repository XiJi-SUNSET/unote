name: 功能建议
description: 提出一个新功能或体验改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目对"加功能"很克制。请先读 [README](../blob/main/README.md) 的「明确不做」和 [路线图](../blob/main/docs/05-roadmap.md)。
        与产品定位冲突的建议（云同步、AI、埋点）会被直接关闭。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体场景
      description: 描述场景，不要直接描述方案。"我想要一个 XX 按钮"不如"我在 XX 情况下会卡住"
      placeholder: 上课连拍 5 张板书，插入后要手动删掉拍糊的，很打断节奏……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的解法
      placeholder: 插入后给一个 3 秒的撤销浮层
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认
      options:
        - label: 这个建议不需要联网
          required: true
        - label: 这个建议不会引入账号体系
          required: true
        - label: 这个建议在我的手机上能明显改善某个场景
          required: true
